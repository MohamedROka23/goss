name: goss
description: "GOSST - Global Outsourcing Services Trading"
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  intl: ^0.20.3
  url_launcher: ^6.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_localizations:
    sdk: flutter
  pdf: ^3.12.0
  excel: ^4.0.6
  archive: ^3.6.1
  share_plus: ^13.3.0
  file_picker: ^12.2.0
  path_provider: ^2.1.6
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.0
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^10.0.0
  uuid: ^4.6.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  flutter_secure_storage: ^11.1.0
  cryptography: ^2.7.0
  image_picker: ^1.2.1
  image: ^4.3.0
  freerasp: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/launcher_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_fg.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon_white.png"
    background_color: "#ffffff"
    theme_color: "#0C2340"
  windows:
    generate: true
    image_path: "assets/icon/icon_white.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon_white.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/
    - assets/anim_logo/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
